# Local run of this agent's image. `plow-agents deploy --local --line ln_xxx`
# mints the credential into ./plow-credentials and brings this up.
services:
  agent:
    build: .
    environment:
      # Which agent this is, for the base's Agent Index reporter. Without it the
      # reporter stands down rather than guessing a name.
      AGENT_ID: watson-delltrak
    env_file:
      - path: ./plow-credentials
        required: false
    volumes:
      # The owner's GitHub tokens, which root keeps after the owner connects
      # GitHub in chat. A named volume takes root:root 0700 from the image on
      # first mount, on Docker Desktop for macOS too, and sits apart from the
      # agent's home so the agent never owns a path to it. `down -v` drops it
      # with everything else, and the owner connects again.
      - watson-github:/var/lib/watson-github
      # The agent's home, kept across `up`/`down` for its sessions and setup.
      # `docker compose down -v` starts this agent fresh, and is what an edit
      # to SOUL.md needs before the agent sees it.
      - agent-home:/var/lib/hermes
    # The only bound on shutdown: nothing in s6 times out the gateway or the
    # cycle, so Docker's SIGKILL at the end of this period is what stops them.
    # Two things need to finish after SIGTERM. The gateway checkpoints, and
    # Docker's default 10s cuts that off and orphans the transcript lease. And
    # an owner notification already in flight has `post_json`'s own 45s timeout;
    # a SIGKILL inside that window leaves the action row on `sending`, because
    # the handler that writes `unknown` never runs. 60s covers both, so the send
    # either lands or times out into its own handler.
    stop_grace_period: 60s
    # No ports: the agent connects to Plow outbound.

volumes:
  agent-home:
  watson-github:
