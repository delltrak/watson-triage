# Merge em config.yaml do Hermes (Dockerfile seed + cont-init 20-watson-mcp).
# Ponte stdio: watson_status, watson_investigate, watson_connect_codex,
# watson_connect_claude (device/remote login URL no chat).
# Sem envio Plow, sem escrita GitHub, sem merge via MCP.
#
# CRITICAL: Hermes starts stdio MCP servers with a filtered env
# (tools/mcp_tool_config.py _build_safe_env): only PATH/HOME-style keys plus
# this `env:` block survive. Without GH_TOKEN here, watson_status reported
# GitHub as disconnected even with github-credentials mounted.
# `${VAR}` is resolved from the gateway env when the config loads; an unset
# var stays as the literal `${VAR}` (watson treats that as absent). The file
# on disk keeps the template, never the value.
# PLOW_AGENT_TOKEN: the OAuth waiter pings the owner DM when login completes.
# HOME pinned: Codex/Claude credentials live under /var/lib/hermes.
# No PATH override: the inherited PATH keeps /opt/hermes/.venv/bin.
mcp_servers:
  watson:
    command: /opt/hermes/.venv/bin/watson
    args: ["--home", "/var/lib/hermes/watson", "mcp"]
    env:
      GH_TOKEN: ${GH_TOKEN}
      PLOW_AGENT_TOKEN: ${PLOW_AGENT_TOKEN}
      # Line default language (e.g. en for a US line); unset stays ${...} = absent.
      WATSON_LANGUAGE: ${WATSON_LANGUAGE}
      HOME: /var/lib/hermes
    timeout: 900
    connect_timeout: 30

# Skills on Plow chat (merged as a union into existing config):
# - watson-playbook ships read-only from the image (external dir): Watson's chat
#   playbook, loaded on demand; hard rules stay in the persona.
# - Bundled skills that are noise for GitHub triage, or risky, are off on the
#   line's two platforms (plow_chat and plow_email): codex/claude-code/opencode push and open NON-draft PRs from the
#   terminal (whose env lacks Watson's credentials), github carries a PAT
#   tutorial. Plow's own skills (plow-invite, owners-mac, google-workspace,
#   plow-connectors) and the essential hermes-agent stay.
skills:
  external_dirs: [/opt/watson-triage/skills]
  platform_disabled:
    plow_chat: &watson_off [
      airtable, architecture-diagram, arxiv, ascii-video, baoyu-infographic, blocked-page-recovery,
      box, claude-code, claude-design, codebase-inspection, codex, competitor-news-monitor,
      computer-use, design-md, document-to-action-items, docx, dogfood, email-inbox-triage,
      gif-search, github, grounded-citations, hermes-agent-skill-authoring, himalaya, humanizer,
      inspecting-hermes-desktop-dom, llm-wiki, manim-video, maps, meeting-action-items,
      node-inspect-debugger, notion, obsidian, opencode, p5js, pdf, popular-web-designs,
      powerpoint, product-price-monitor, python-debugpy, requesting-code-review, sdlc-review,
      simplify-code, songsee, songwriting-and-ai-music, spike, systematic-debugging,
      teams-meeting-pipeline, test-driven-development, weekly-review-planning, xlsx, xurl,
      youtube-content
    ]
    plow_email: *watson_off
